name: Daily wallet scan

on:
  schedule:
    # Every day at 06:00 UTC (after US market close + settlement)
    - cron: "0 6 * * *"
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --legacy-peer-deps

      - name: Run full scan
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: npx tsx scripts/fullscan.ts

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "wallets=$(node -e 'console.log(require("./data/wallets.json").length)')" >> $GITHUB_OUTPUT
            echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wallets.json data/snapshots/
          git commit -m "Daily scan: ${{ steps.changes.outputs.wallets }} wallets (${{ steps.changes.outputs.date }})"
          git push
